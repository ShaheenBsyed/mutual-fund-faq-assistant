name: Daily Mutual Fund Data Refresh

on:
  schedule:
    # Run daily at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Enable manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Ingestion Pipeline (Force Refresh)
        run: |
          python -m src.phase1_ingestion.main --force

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.html data/processed/corpus.json
          git diff-index --quiet HEAD || (git commit -m "Auto-refresh: Ingested latest Groww data" && git push origin HEAD:${{ github.ref_name }})
